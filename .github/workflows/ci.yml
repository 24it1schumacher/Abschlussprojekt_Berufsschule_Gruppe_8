# Automatische Pruefung jeder Aenderung (User Story 27 / Issue #28)
#
# Laeuft bei jedem Push und jedem Pull Request. Der Server spielt nur Commits ein,
# bei denen alle drei Pruefungen gruen sind (siehe infra/deploy/auto-update.sh).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven build mit Tests
        working-directory: app/backend
        run: mvn -B package
      - name: Testberichte aufbewahren
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-testberichte
          path: app/backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend – Typpruefung und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - working-directory: app/frontend
        run: npm ci
      - working-directory: app/frontend
        run: npm run build

  container:
    name: Container – Images und Konfiguration
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Backend-Image bauen
        run: docker build -t maschinenverleih-backend:ci app/backend
      - name: Webserver-Image bauen
        run: docker build -t maschinenverleih-web:ci app/frontend
      - name: Caddyfile pruefen
        run: >
          docker run --rm -v "$PWD/infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro"
          maschinenverleih-web:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Compose-Dateien pruefen
        env:
          POSTGRES_ADMIN_PASSWORD: ci-dummy
          APP_DB_PASSWORD: ci-dummy
        run: |
          docker compose -f infra/postgres/compose.yaml config --quiet
          docker compose -f infra/stack/compose.yaml config --quiet
      - name: Shell-Skripte pruefen
        run: shellcheck -S warning infra/deploy/*.sh infra/postgres/*.sh
