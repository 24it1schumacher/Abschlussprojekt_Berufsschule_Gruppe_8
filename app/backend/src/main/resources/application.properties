spring.application.name=maschinenverleih-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maschinenverleih}
spring.datasource.username=${DB_USERNAME:maschinenverleih_app}
spring.datasource.password=${DB_PASSWORD}

# Schema and database setup must be performed explicitly, never as a startup side effect.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
