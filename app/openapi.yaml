openapi: 3.0.3
info:
  title: Maschinenverleih API
  version: 0.1.0
  description: Startvertrag für das TypeScript-Frontend und Java-Backend.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      summary: Prüft, ob das Backend erreichbar ist
      responses:
        "200":
          description: Backend ist erreichbar
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /api/messages:
    get:
      summary: Listet gespeicherte Beispielnachrichten
      responses:
        "200":
          description: Nachrichten wurden gelesen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      summary: Speichert eine Beispielnachricht
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Nachricht wurde gespeichert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Anfrage ist ungültig
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  schemas:
    CreateMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500
          example: Erste Testnachricht
    Message:
      type: object
      required: [id, text, createdAt]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        createdAt:
          type: string
          format: date-time
  responses:
    DatabaseUnavailable:
      description: Datenbank ist nicht verfügbar oder nicht vorbereitet
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                example: Datenbank ist vorübergehend nicht verfügbar.
